<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      No external anything: no CDN, no analytics, no remote fonts. The CSP below
      forbids them anyway, and this meta makes that visible in the document.
    -->
    <meta name="referrer" content="no-referrer" />
    <!--
      A second copy of the policy as a header, which is the one that counts.
      `frame-ancestors` is deliberately absent here: it is ignored when delivered
      through a meta element, and only the header version can set it.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'" />
    <title>OneNote exporter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
